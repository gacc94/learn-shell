name: CI - Shell

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-verify:
        name: Build & Verify
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run Linter
              run: bun run lint

            - name: Type check
              run: bun x tsc --noEmit

            - name: Build production bundle
              run: bun run build:gh-pages

            - name: Sync production federation manifest
              run: cp public/federation.manifest.prod.json dist/learn-shell/browser/federation.manifest.json

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: learn-shell-dist
                  path: dist/learn-shell/browser
                  retention-days: 1

    codeql-analysis:
        name: CodeQL Security Analysis
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            actions: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  build-mode: none

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4

