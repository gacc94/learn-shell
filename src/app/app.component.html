<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<mat-sidenav-container class="dashboard-container">
    <!-- Menú lateral ultra elegante estilo Bright AI -->
    <mat-sidenav
        #sidenav
        mode="side"
        [opened]="true"
        class="dashboard-sidenav"
        aria-label="Menú principal de navegación"
    >
        <div class="sidenav-header">
            <div class="brand-container">
                <div class="brand-logo" aria-hidden="true">
                    <svg class="brand-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="16" cy="16" r="16" fill="#2762ea" />
                        <path
                            d="M11 11C11 9.89543 11.8954 9 13 9C14.1046 9 15 9.89543 15 11C15 12.1046 14.1046 13 13 13C11.8954 13 11 12.1046 11 11Z"
                            fill="white"
                        />
                        <path
                            d="M17 21C17 19.8954 17.8954 19 19 19C20.1046 19 21 19.8954 21 21C21 22.1046 20.1046 23 19 23C17.8954 23 17 22.1046 17 21Z"
                            fill="white"
                        />
                        <path d="M13.5 12.5L18.5 19.5" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                        <circle cx="12" cy="20" r="2" fill="white" fill-opacity="0.8" />
                        <circle cx="20" cy="12" r="2" fill="white" fill-opacity="0.8" />
                    </svg>
                </div>
                <span class="brand-name">Bright AI</span>
            </div>
        </div>

        <nav class="sidenav-nav">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a
                        mat-list-item
                        routerLink="/home"
                        routerLinkActive="active-nav-item"
                        (click)="closeMobileMenu()"
                        class="nav-link"
                    >
                        <div class="nav-icon-circle">
                            <mat-icon class="nav-icon">home</mat-icon>
                        </div>
                        <span class="nav-label">Home</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        mat-list-item
                        routerLink="/shadowing"
                        routerLinkActive="active-nav-item"
                        (click)="closeMobileMenu()"
                        class="nav-link"
                    >
                        <div class="nav-icon-circle">
                            <mat-icon class="nav-icon">pie_chart</mat-icon>
                        </div>
                        <span class="nav-label">Spending</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        mat-list-item
                        routerLink="/grammar"
                        routerLinkActive="active-nav-item"
                        (click)="closeMobileMenu()"
                        class="nav-link"
                    >
                        <div class="nav-icon-circle">
                            <mat-icon class="nav-icon">trending_up</mat-icon>
                        </div>
                        <span class="nav-label">Investments</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a mat-list-item routerLink="/home" class="nav-link nav-link-secondary" (click)="closeMobileMenu()">
                        <div class="nav-icon-circle">
                            <mat-icon class="nav-icon">calendar_today</mat-icon>
                        </div>
                        <span class="nav-label">Calendar</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a mat-list-item routerLink="/home" class="nav-link nav-link-secondary" (click)="closeMobileMenu()">
                        <div class="nav-icon-circle">
                            <mat-icon class="nav-icon">layers</mat-icon>
                        </div>
                        <span class="nav-label">Equity</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a mat-list-item routerLink="/home" class="nav-link nav-link-secondary" (click)="closeMobileMenu()">
                        <div class="nav-icon-circle">
                            <mat-icon class="nav-icon">chat_bubble_outline</mat-icon>
                        </div>
                        <span class="nav-label">Search</span>
                    </a>
                </li>
            </ul>
        </nav>
    </mat-sidenav>

    <!-- Área de contenido del dashboard -->
    <mat-sidenav-content class="dashboard-content-area">
        <!-- Barra superior limpia y moderna -->
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <button
                    mat-icon-button
                    type="button"
                    class="mobile-menu-toggle"
                    (click)="sidenav.toggle()"
                    aria-label="Alternar menú lateral"
                >
                    <mat-icon>menu</mat-icon>
                </button>

                <h1 class="toolbar-title greeting-text">Good Morning, William</h1>

                <button type="button" class="promo-pill-btn" aria-label="Obtener $25 de recompensa">
                    <span class="gift-emoji" aria-hidden="true">🎁</span>
                    <span>Get $25</span>
                </button>
            </div>

            <div class="topbar-right">
                <button type="button" class="account-pill-btn"><span class="plus-sign">+</span> Account</button>

                <button type="button" class="icon-round-btn" aria-label="Notificaciones">
                    <mat-icon class="bell-icon">notifications_none</mat-icon>
                    <span class="notification-indicator" aria-hidden="true"></span>
                </button>

                <div class="user-avatar" title="William's Profile">
                    <div class="avatar-gradient">
                        <span class="avatar-initials">W</span>
                    </div>
                </div>
            </div>
        </header>

        <main id="main-content" class="content-wrapper" tabindex="-1">
            <router-outlet />
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
